<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="../../tokens.css">

<style>

.demo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4) var(--space-6); }

<body class="myl-root">
<div class="demo">
<div class="pair"><button type="button" class="myl-text-button">Reword</button><button type="button" class="myl-text-button" disabled>Run page</button></div>
