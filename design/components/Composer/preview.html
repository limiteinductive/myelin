<!-- @dsCard group="Thread" height=320 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&display=swap">
<style>
body { margin: 0; padding: 24px; }
.demo { max-width: var(--reading-width); margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-6); }
</style>
</head>
<body class="myl-root">
<div class="demo">
<form class="myl-composer" onsubmit="return false">
<div class="myl-composer__row">
<button type="button" class="myl-icon-button" aria-label="Add a photo, code or scratch work"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M9 3v12M3 9h12"></path></svg></button>
<input class="myl-composer__field" type="text" aria-label="Message" placeholder="Say anything">
<button type="submit" class="myl-send" aria-label="Send" disabled><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5"></path></svg></button>
</div>
</form>
<form class="myl-composer" onsubmit="return false">
<div class="myl-composer__scope">On step 4. Clear the selection to talk in the thread.</div>
<div class="myl-composer__row">
<button type="button" class="myl-icon-button" aria-label="Add a photo, code or scratch work"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M9 3v12M3 9h12"></path></svg></button>
<input class="myl-composer__field" type="text" aria-label="Message about step 4" value="because b was a constant there">
<button type="submit" class="myl-send" aria-label="Send"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5"></path></svg></button>
</div>
</form>
<form class="myl-composer" onsubmit="return false">
<div class="myl-composer__scope myl-composer__scope--offline" role="status">Not connected. Your draft is kept here.</div>
<div class="myl-composer__row">
<button type="button" class="myl-icon-button" aria-label="Add a photo, code or scratch work"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M9 3v12M3 9h12"></path></svg></button>
<input class="myl-composer__field" type="text" aria-label="Message" value="so the baseline cancels in expectation">
<button type="submit" class="myl-send" aria-label="Send" disabled><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5"></path></svg></button>
</div>
</form>
</div>
</body>
</html>
