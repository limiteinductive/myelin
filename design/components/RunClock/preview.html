<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
body { margin: 0; padding: 24px; }
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); }
</style>
</head>
<body class="myl-root">
<div class="demo">
<div class="myl-clock" role="timer" aria-label="Time left"><span class="myl-clock__time">05:30</span><span class="myl-clock__of">left of 20:00</span></div>
<div class="myl-clock myl-clock--last" role="timer" aria-label="Time left, last minute"><span class="myl-clock__time">00:48</span><span class="myl-clock__of">left of 20:00</span></div>
<div class="myl-clock myl-clock--paused" role="timer" aria-label="Paused"><span class="myl-clock__time">05:30</span><span class="myl-clock__of">paused</span></div>
</div>
</body>
</html>
