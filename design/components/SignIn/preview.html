<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&display=swap">
<style>
html, body { height: 100%; margin: 0; }
</style>
</head>
<body class="myl-root">
<main class="myl-signin">
<span class="myl-logo" style="font-size: 40px"><svg class="myl-logo__mark" viewBox="0 0 96 96" aria-hidden="true"><path d="M12 88V56a18 18 0 0 1 36 0M48 88V32a18 18 0 0 1 36 0V88" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="round"></path></svg>Myelin</span>
<form class="myl-composer" onsubmit="return false">
<div class="myl-composer__row">
<input class="myl-composer__field" type="text" aria-label="Invite link" placeholder="Paste your invite link">
<button type="submit" class="myl-send" aria-label="Sign in" disabled><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5"></path></svg></button>
</div>
</form>
<p class="myl-trace">Whoever runs this server can make you a link.</p>
</main>
</body>
</html>
